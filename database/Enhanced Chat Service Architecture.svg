.26" y="228.493">- Persist via API in background</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="196.8535" x="541.26" y="244.2923">- Return temp message for UI</text></g><!--link EnhancedChatService to WebSocketConnection--><g id="link_EnhancedChatService_WebSocketConnection"><path codeLine="50" d="M225.72,308.1473 C202.89,334.5473 183.5855,356.8696 163.6455,379.9196 " fill="none" id="EnhancedChatService-to-WebSocketConnection" style="stroke:#1976D2;stroke-width:1.0;"/><polygon fill="#1976D2" points="159.72,384.4573,168.6333,380.2677,162.9912,380.6759,162.5831,375.0338,159.72,384.4573" style="stroke:#1976D2;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="59.103" x="198.95" y="351.9871">manages</text></g><!--link EnhancedChatService to HTTPAPIConnection--><g id="link_EnhancedChatService_HTTPAPIConnection"><path codeLine="51" d="M332.37,308.1473 C332.37,337.8973 332.37,362.2273 332.37,387.0373 " fill="none" id="EnhancedChatService-to-HTTPAPIConnection" style="stroke:#1976D2;stroke-width:1.0;"/><polygon fill="#1976D2" points="332.37,393.0373,336.37,384.0373,332.37,388.0373,328.37,384.0373,332.37,393.0373" style="stroke:#1976D2;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="29.5166" x="333.37" y="351.9871">uses</text></g><!--link EnhancedChatService to MessageCallbacks--><g id="link_EnhancedChatService_MessageCallbacks"><path codeLine="52" d="M442.77,308.1473 C469.41,337.8973 492.5581,363.7569 514.7681,388.5669 " fill="none" id="EnhancedChatService-to-MessageCallbacks" style="stroke:#1976D2;stroke-width:1.0;"/><polygon fill="#1976D2" points="518.77,393.0373,515.7474,383.6637,515.4351,389.312,509.7868,388.9996,518.77,393.0373" style="stroke:#1976D2;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="47.4614" x="479.45" y="351.9871">